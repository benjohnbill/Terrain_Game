<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrain Game — 세로 eval 바 쇼다운 프로토타입 v2 (throwaway)</title>
<!--
  SHOWDOWN + VERTICAL EVAL-BAR THROWAWAY v2 (grey-box). NOT L3 build source (ADR 0041).
  Rebuilt to the user's spec (2026-07-23):
  - EVAL BAR = VERTICAL, left edge, chess.com style. WHITE(bottom)=my advantage,
    BLACK(top)=enemy advantage, GREY=recon-confidence RANGE of the EQUAL-COMMIT R.
    Plain. A small R number at the bottom. NO COMMIT INFO on the bar — EVER.
    The bar shows the situation UNDER EQUAL COMMIT; the player reads it and decides
    separately whether to invest 행동력 (the bottom commit bar).
  - THRESHOLDS (신중 압박 / 포위 섬멸): hidden by default; appear REACTIVELY only when
    an operation is selected; shown as a RANGE beside the bar, not a needle.
  - 정찰 narrows the GREY band (recon = shrink uncertainty; witness model: center
    wobbles, width shrinks, truth stays inside).
  - COMMIT = a large BOTTOM bar (the main action). Its effect shows in the board
    outcome, never on the eval bar.
  - Grey-box on purpose: testing whether the concept has a heartbeat without art.
  Numbers 가안 (feel = L3). 명량 fixture authored, not computed.
-->
<style>
  :root{--sea:#0e1a22;--ink:#dce3ea;--dim:#8592a0;--line:#28323d;--gold:#ffd27f;
    --good:#4fbf7f;--bad:#ff6a5a;--self:#4a86c8;--foe:#c8524a;
    --wht:#e7ecf1;--blk:#2b323b;--gry:#727c88;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--sea);color:var(--ink);
    font:13px/1.45 system-ui,"Segoe UI",sans-serif;user-select:none;overflow:hidden;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}
  #head{padding:7px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;
    align-items:center;font-size:12px;color:var(--dim);}
  #head b{color:#fff;font-size:13px;} #head .tag{color:var(--gold);}
  #head .grey{margin-left:auto;font-size:11px;color:#5f6b78;}

  #stage{flex:1 1 auto;min-height:0;display:flex;}

  /* ── vertical eval bar (chess.com style) ── */
  #evalwrap{flex:0 0 118px;position:relative;background:#0a1117;border-right:1px solid var(--line);
    display:flex;flex-direction:column;}
  #evaltop{font-size:10.5px;color:#7f8b98;text-align:center;padding:6px 4px 4px;}
  #evalcol{flex:1 1 auto;position:relative;margin:0 auto;width:44px;border-radius:5px;
    overflow:hidden;background:var(--blk);box-shadow:0 0 0 1px #000 inset;}
  #ewhite{position:absolute;left:0;right:0;bottom:0;background:var(--wht);}
  #egrey{position:absolute;left:0;right:0;background:var(--gry);
    background-image:repeating-linear-gradient(-45deg,#00000018 0 5px,transparent 5px 10px);}
  #ehinge{position:absolute;left:0;right:0;height:1px;background:#0009;}
  #rnum{position:absolute;left:0;right:0;bottom:3px;text-align:center;font:800 13px system-ui;color:#1a1f26;}
  #rnum.dis{bottom:auto;top:3px;color:#e7ecf1;}
  /* reactive threshold markers, drawn to the RIGHT of the column */
  #thlayer{position:absolute;left:76px;right:2px;top:0;bottom:0;pointer-events:none;}
  .thmark{position:absolute;left:0;right:0;}
  .thmark .zone{position:absolute;left:0;right:2px;background:#ffffff10;border-top:1.5px solid var(--gold);border-bottom:1.5px dashed #ffffff55;}
  .thmark .lab{position:absolute;right:2px;font-size:9px;font-weight:700;color:var(--gold);white-space:nowrap;transform:translateY(-11px);}
  .thmark.foe .zone{border-top-color:#e07a3a;} .thmark.foe .lab{color:#e07a3a;}
  #evalfoot{font-size:9.5px;color:#5f6b78;text-align:center;padding:4px 4px 7px;line-height:1.3;}

  /* board */
  #board{flex:1 1 auto;position:relative;background:radial-gradient(120% 120% at 50% 30%,#12262f,#0a151c);}
  #board svg{position:absolute;inset:0;width:100%;height:100%;}
  .cnt{transition:transform .5s cubic-bezier(.16,1,.3,1);}
  @keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}

  /* narrative */
  #narr{flex:0 0 auto;padding:8px 16px;border-top:1px solid var(--line);background:#0b151c;}
  #narr .t{font:700 15px system-ui;color:#fff;} #narr .s{font-size:12.5px;color:#9fb0bd;margin-top:2px;min-height:16px;}

  /* ── bottom commit bar (the main action) ── */
  #commit{flex:0 0 auto;padding:10px 16px 14px;border-top:1px solid var(--line);background:#0c1620;
    display:flex;align-items:center;gap:16px;}
  #ops{display:flex;gap:6px;}
  .op{border:1px solid #3a4757;background:#1a2430;color:var(--ink);border-radius:7px;padding:7px 12px;
    cursor:pointer;font-size:12.5px;white-space:nowrap;}
  .op:hover{border-color:var(--gold);} .op.on{background:var(--gold);border-color:#fff2c8;color:#1a1408;font-weight:700;}
  #cdial{flex:1 1 auto;display:flex;align-items:center;gap:10px;}
  #cdial .cap{font:700 13px system-ui;color:#fff;white-space:nowrap;}
  #cdial input{flex:1 1 auto;accent-color:var(--gold);height:26px;}
  #cdial .rd{font-size:11.5px;color:#9fb0bd;white-space:nowrap;min-width:150px;}
  .btn{border:1px solid #3a4757;background:#1d2732;color:var(--ink);border-radius:8px;padding:9px 16px;
    cursor:pointer;font-size:13.5px;white-space:nowrap;}
  .btn:hover{border-color:var(--gold);}
  .btn.go{background:#243a2a;border-color:#3f7a4f;color:#d6f0dc;font-weight:700;} .btn.go:hover{background:#2c492f;}
  .btn.ghost{background:transparent;color:var(--dim);}
  .hidden{display:none;}
</style>
</head>
<body>
<div id="app">
  <div id="head"><b>명량 — 관문 방어</b><span class="tag" id="phasetag">계획 단계</span>
    <span class="grey">v2 · 세로 eval 바 · grey-box · feel-probe</span></div>

  <div id="stage">
    <div id="evalwrap">
      <div id="evaltop">적 우세 ▲<br><span style="color:#4a5560">흑</span></div>
      <div id="evalcol">
        <div id="ewhite"></div><div id="egrey"></div><div id="ehinge"></div>
        <div id="rnum">0.95</div>
      </div>
      <div id="thlayer"></div>
      <div id="evalfoot"><span style="color:#8a93a0">백</span> ▼ 내 우세<br>회색 = 정찰 신뢰도</div>
    </div>
    <div id="board"><svg id="boardsvg" viewBox="0 0 900 380" preserveAspectRatio="xMidYMid meet"></svg></div>
  </div>

  <div id="narr"><div class="t" id="ntitle">상황을 읽고 커밋을 정하라</div>
    <div class="s" id="nsub">왼쪽 세로 바 = 동일 커밋 전제의 상황. 흰색이 적으면 열세. 정찰로 회색(불확실)을 좁히고, 작전을 고르면 필요 문턱이 바 옆에 떠요. 그걸 보고 행동력을 얼마나 부을지 스스로 결정.</div></div>

  <div id="commit">
    <div id="ops">
      <button class="op" data-op="정찰">정찰 ⟳</button>
      <button class="op" data-op="신중압박">신중 압박</button>
      <button class="op" data-op="포위섬멸">포위 섬멸</button>
    </div>
    <div id="cdial"><span class="cap">행동력 커밋</span>
      <input id="commitrange" type="range" min="20" max="100" value="70">
      <span class="rd" id="crd"></span></div>
    <button class="btn go" id="play">▶ 쇼다운 재생</button>
    <button class="btn ghost hidden" id="next">다음 ▷</button>
    <button class="btn ghost hidden" id="reset">↺ 다시</button>
  </div>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wp=R=>clamp(50+(clamp(R,0.5,2.5)-1)*45,3,97);   // R → white% (my-advantage fill)
const TH={신중압박:1.10,포위섬멸:1.92};

// authored 명량 fixture — EQUAL-COMMIT situation R per beat (NO commit influence on the bar)
const BEATS=[
  {t:'적 주력 도착',s:'밴드 하단이 진실이었다 — 예상보다 두텁다',lo:0.76,hi:0.96,cue:'bad'},
  {t:'관문이 병목',s:'관문 cap 1000 — 그의 대군이 한 번에 다 못 붙는다',lo:1.06,hi:1.28,cue:'good'},
  {t:'피로 · 보급 소모',s:'그의 주력은 내 문 앞에서 피로·보급 압박, 요새가 버틴다',lo:1.24,hi:1.44,cue:'good'},
  {t:'mutual-exposure',s:'그가 앞으로 올인했다 — 그의 수도가 지금 무방비다',lo:1.34,hi:1.54,cue:'good',foeThreat:true},
];
// recon steps narrow the plan-phase grey band; center wobbles (witness model), truth inside
const RECON=[{c:0.95,w:0.46},{c:0.89,w:0.30},{c:0.93,w:0.19},{c:0.905,w:0.12}];

const state={phase:'plan',beat:-1,commit:70,op:null,recon:0};
const holds=()=>state.commit>=55;   // commit (separate from the bar) decides the board outcome

function bandTarget(){
  if(state.phase==='plan'){const r=RECON[state.recon];return {lo:r.c-r.w/2,hi:r.c+r.w/2,cue:'fog'};}
  if(state.beat<BEATS.length){const e=BEATS[state.beat];return {lo:e.lo,hi:e.hi,cue:e.cue};}
  // final: the equal-commit SITUATION resolves favourable (~1.5) regardless of commit;
  // whether you actually HOLD is decided by commit, shown on the BOARD + narrative.
  return {lo:1.44,hi:1.58,cue:holds()?'good':'bad'};
}

// ── vertical bar render ──
let disp={lo:0.72,hi:1.18};
function drawEval(){
  const {lo,hi}=disp, c=(lo+hi)/2, wl=wp(lo), wh=wp(hi);
  $('ewhite').style.height=wl+'%';
  $('egrey').style.bottom=wl+'%'; $('egrey').style.height=(wh-wl)+'%';
  $('ehinge').style.bottom=wp(c)+'%';
  const rn=$('rnum'); rn.textContent=c.toFixed(2);
  rn.className=(c<0.98?'dis':'');           // sits in white (bottom) if ahead, else black (top)
  drawTh();
}
function drawTh(){
  const L=$('thlayer'); L.innerHTML='';
  if(state.phase!=='plan'||!state.op||state.op==='정찰') return;
  const rv=TH[state.op], nm=state.op==='신중압박'?'신중 압박':'포위 섬멸';
  const foe=state.op==='포위섬멸';
  // range form: threshold ± a confidence margin (wider when recon is poor)
  const mrg=0.05+0.10*(1-state.recon/3);
  const b=wp(rv-mrg), t=wp(rv+mrg);
  L.innerHTML=`<div class="thmark ${foe?'foe':''}">`
    +`<div class="zone" style="bottom:${b}%;height:${t-b}%"></div>`
    +`<div class="lab" style="bottom:${t}%">${nm} ${rv.toFixed(2)} 필요</div></div>`;
}
// tween band so the bar SWINGS
let anim=null;
function tween(tg){ if(anim)cancelAnimationFrame(anim);
  const f={...disp}, t0=performance.now(), D=520;
  (function s(now){const k=clamp((now-t0)/D,0,1),e=1-Math.pow(1-k,3);
    disp={lo:f.lo+(tg.lo-f.lo)*e,hi:f.hi+(tg.hi-f.hi)*e}; drawEval(); if(k<1)anim=requestAnimationFrame(s);})(t0); }

// ── board (reused 명량 schematic) ──
function enemyPos(){
  if(state.phase==='plan')return{x:665,y:150,label:'?',sub:'≈ 2.4k–3.6k?',foe:true};
  const b=state.beat;
  if(b===0)return{x:575,y:158,label:'3.2k',sub:'두텁다',foe:true};
  if(b>=1&&b<BEATS.length)return{x:478,y:186,label:'3.2k',sub:['','관문서 막힘','피로·보급','후방 무방비'][b],foe:true};
  return holds()?{x:610,y:150,label:'궤멸',sub:'꺾였다',routed:true}
                :{x:250,y:262,label:'3.0k',sub:'돌파',through:true};
}
function drawBoard(){
  const done=state.beat>=BEATS.length, brk=done&&!holds(), en=enemyPos();
  let s='';
  s+=`<rect x="0" y="0" width="450" height="380" fill="#20456a" opacity="0.16"/>`;
  s+=`<rect x="450" y="0" width="450" height="380" fill="#6a2a2a" opacity="${brk?0.24:0.16}"/>`;
  s+=`<polygon points="392,36 548,36 470,150" fill="#4a4640" stroke="#33302b"/>`;
  s+=`<polygon points="392,344 548,344 470,230" fill="#4a4640" stroke="#33302b"/>`;
  s+=`<text x="470" y="26" text-anchor="middle" fill="#8a857c" font-size="11">▲ 산맥</text>`;
  s+=`<text x="470" y="366" text-anchor="middle" fill="#8a857c" font-size="11">▲ 산맥</text>`;
  const passHot=state.phase!=='plan'&&state.beat>=1&&!done;
  s+=`<rect x="440" y="152" width="60" height="76" rx="6" fill="none" stroke="${passHot?'#ffd27f':'#5b6b52'}" stroke-width="${passHot?3:2}" ${passHot?'style="animation:pulse 1.3s infinite"':''}/>`;
  s+=`<text x="470" y="196" text-anchor="middle" fill="#cdd7c6" font-size="11" font-weight="700">관문</text>`;
  s+=`<text x="470" y="210" text-anchor="middle" fill="#9aa891" font-size="9.5">cap 1000</text>`;
  s+=`<text x="215" y="66" text-anchor="middle" fill="#8fa6bd" font-size="12">관중 관문 (요새)</text>`;
  s+=`<text x="690" y="66" text-anchor="middle" fill="#c89a9a" font-size="12">중원 평야</text>`;
  s+=capital(110,300,'촉 수도','내 왕좌','#8fb6e0',brk);
  s+=capital(806,92,'중원 수도','적 왕좌','#e0b48f',state.beat===BEATS.length-1);
  const you=brk?{label:'1.1k',sub:'큰 손실'}:{label:'2.4k',sub:'요새'};
  s+=counter(235,208,'#2f6fb8','#eaf4ff',you.label,you.sub,false,false);
  s+=counter(en.x,en.y,'#b0433c','#ffd9c9',en.label,en.sub,true,en.routed);
  $('boardsvg').innerHTML=s;
}
function capital(x,y,nm,role,col,threat){
  return `<g class="cnt">${threat?`<circle cx="${x}" cy="${y}" r="26" fill="none" stroke="#ff5a5a" stroke-width="2.5" style="animation:pulse 1s infinite"/>`:''}`
    +`<text x="${x}" y="${y+6}" text-anchor="middle" font-size="20" fill="#ffe9a8" style="paint-order:stroke;stroke:#0009;stroke-width:2px">★</text>`
    +`<text x="${x}" y="${y+22}" text-anchor="middle" font-size="10" fill="${col}">${nm}</text>`
    +`<text x="${x}" y="${y+34}" text-anchor="middle" font-size="9" fill="#7f8b98">${role}${threat?' · 위협!':''}</text></g>`;
}
function counter(x,y,fill,ink,label,sub,foe,routed){
  const W=64,H=40,op=routed?0.4:1;
  return `<g class="cnt" transform="translate(${x-W/2},${y-H/2})" opacity="${op}">`
    +`<rect width="${W}" height="${H}" rx="7" fill="${fill}" ${foe?'fill-opacity="0.9" stroke-dasharray="6 3"':''} stroke="${ink}" stroke-width="2"/>`
    +`<text x="${W/2}" y="${H/2+2}" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">${label}</text>`
    +`<text x="${W/2}" y="${H+13}" text-anchor="middle" fill="${foe?'#ffb9a9':'#bcd6f2'}" font-size="9.5">${sub||''}</text></g>`;
}

function setNarr(t,s){$('ntitle').textContent=t;$('nsub').textContent=s;}
function render(){drawBoard();tween(bandTarget());}
function updDial(){
  const ok=holds();
  $('crd').innerHTML=`커밋 <b>${state.commit}%</b> · 이 정도면 <b style="color:${ok?'#7fe0a0':'#ff8a78'}">${ok?'유리한 상황 실현':'상황 못 살림 (불안)'}</b>`;
}

// ── events ──
$('commitrange').addEventListener('input',e=>{state.commit=+e.target.value;updDial();});
document.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>{
  const op=b.dataset.op;
  if(op==='정찰'){ if(state.phase==='plan'&&state.recon<RECON.length-1){state.recon++;tween(bandTarget());}
    setNarr('정찰',`신뢰도 풀을 써서 회색(불확실)을 좁혔다. 밴드가 흔들리며 조여진다 (${state.recon}/${RECON.length-1}). 진실은 늘 밴드 안.`); return; }
  state.op=(state.op===op?null:op);
  document.querySelectorAll('.op[data-op="신중압박"],.op[data-op="포위섬멸"]').forEach(x=>x.classList.toggle('on',x.dataset.op===state.op));
  drawTh();
  setNarr(state.op?`작전: ${op==='신중압박'?'신중 압박':'포위 섬멸'}`:'작전 해제',
    state.op?`문턱이 바 옆에 범위로 떴다 — 동일 커밋 R이 이 범위를 넘어야 성립. 안 넘으면 행동력을 더 부어라.`:'문턱을 감췄다.');
}));
$('play').addEventListener('click',()=>{
  state.phase='reveal';state.beat=0;$('thlayer').innerHTML='';
  $('phasetag').textContent='쇼다운';$('play').classList.add('hidden');
  $('next').classList.remove('hidden');$('reset').classList.remove('hidden');
  $('ops').style.opacity=.4;$('cdial').style.opacity=.4;
  const e=BEATS[0];setNarr(e.t,e.s);render();
});
$('next').addEventListener('click',()=>{
  state.beat++;
  if(state.beat<BEATS.length){const e=BEATS[state.beat];setNarr(e.t,e.s);}
  else{$('next').classList.add('hidden');
    holds()?setNarr('명량','좁은 목에서 대군을 꺾었다. 열세로 시작해 뒤집은 이게 매드무비.')
           :setNarr('관문이 무너진다','상황은 유리했는데(왼쪽 바) 커밋이 모자랐다. 대군이 목을 넘는다.');}
  render();
});
$('reset').addEventListener('click',()=>{
  Object.assign(state,{phase:'plan',beat:-1,op:null,recon:0});
  $('phasetag').textContent='계획 단계';$('play').classList.remove('hidden');
  $('next').classList.add('hidden');$('reset').classList.add('hidden');
  $('ops').style.opacity=1;$('cdial').style.opacity=1;
  document.querySelectorAll('.op').forEach(x=>x.classList.remove('on'));
  setNarr('상황을 읽고 커밋을 정하라','왼쪽 세로 바 = 동일 커밋 전제의 상황. 정찰로 회색을 좁히고, 작전을 고르면 필요 문턱이 바 옆에 떠요.');
  render();
});

updDial(); disp={...bandTarget()}; render(); drawEval();
console.log('[showdown v2] ready — vertical eval bar, 명량 fixture, grey-box');
</script>
</body>
</html>
