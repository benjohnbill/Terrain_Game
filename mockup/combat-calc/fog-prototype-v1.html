  - Glance-scale marks: field armies are counters, reach cones shade actual
    reachable hexes, the border alarm lights the border line itself,
    situation hints are worded chips, estimate bands are endpoint bars.
  - Guided callouts: numbered balloons explain each mark and state the
    question it asks. Toggle with the 안내 button.
  - Variant C added: the same information spread out traditional-wargame
    style — the control group for the entrance-design (door) question.

  Variants (?variant=A|B|C, floating bar, arrow keys):
    A — 2 doors (참모 보고 / 내정) + 판세 lens; command is map-native.
    B — 3 doors (+ 군령); commit/projection live behind the 군령 door.
    C — no doors: everything always visible (control group).
  Scenes (?scene=1|2|3, keys 1-3): quiet turn / threat phase / post-battle.

  Non-leak: this file authors viewer-safe fiction directly (bands, fixes,

<script type="module">
'use strict';
const { CRADLE_MAP: MAP, CRADLE_BINDING: BINDING, CRADLE_META: META } = window.TC.gen;

// ---- workbench geometry (verbatim reuse) -----------------------------------
const HEX = META.hexR;
const EDGE_NB = [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]];
const TERR = { plains: '#7d9a54', 'river-valley': '#5d9078', steppe: '#a89a55',
  desert: '#c6aa69', mountain: '#877663', oasis: '#6fae7c', highland: '#5e6b4a' };
const RANGE_FILL = '#4e4034';
const CLS_STYLE = { pass: ['#6b543f', 5], river: ['#57a7d8', 4.5],
  forest: ['#2f4d22', 4.5], hills: ['#8a744c', 4.5] };
const DOORCAP = { pass: 1000, river: 1000, forest: 1500, hills: 1300 };
const nameOf = Object.fromEntries(MAP.regions.map((r) => [r.id, r.name]));
const pairKey = (a, b) => (a < b ? a + '|' + b : b + '|' + a);
function hexToPixel(q, r) { return { x: HEX * Math.sqrt(3) * (q + r / 2), y: HEX * 1.5 * r }; }
function corners(x, y) { const p = [];
  for (let i = 0; i < 6; i++) { const a = Math.PI / 180 * (60 * i - 30);
    p.push([x + HEX * Math.cos(a), y + HEX * Math.sin(a)]); } return p; }
function tint(hex, dv) { const n = parseInt(hex.slice(1), 16);
  const c = (v) => Math.max(0, Math.min(255, v + dv));
  return '#' + [c(n >> 16), c((n >> 8) & 255), c(n & 255)]
    .map((v) => v.toString(16).padStart(2, '0')).join(''); }
const hexOwn = new Map();
for (const [sid, sec] of Object.entries(MAP.sectors))
  for (const u of sec.mapUnits) { const { x, y } = hexToPixel(u.q, u.r);
    hexOwn.set(u.q + ',' + u.r, { sid, rid: sec.regionId, terr: u.terrainLayer, q: u.q, r: u.r, x, y }); }
function secCentroid(sid) { const us = MAP.sectors[sid].mapUnits; let x = 0, y = 0;
  for (const u of us) { const p = hexToPixel(u.q, u.r); x += p.x; y += p.y; }
  return { x: x / us.length, y: y / us.length }; }
function polyPts(h) { return corners(h.x, h.y).map(([x, y]) => x.toFixed(1) + ',' + y.toFixed(1)).join(' '); }

// generic smoothed-outline helper (silhouette + reach cones share it)
function loopsD(cellMap) {
  const pk2 = (x, y) => x.toFixed(1) + ',' + y.toFixed(1);
  const segMap = new Map();
  for (const [k, h] of cellMap) {
    const [q, r] = k.split(',').map(Number);
    const cs = corners(h.x, h.y);
    for (let i = 0; i < 6; i++) {
      if (cellMap.has((q + EDGE_NB[i][0]) + ',' + (r + EDGE_NB[i][1]))) continue;
      const c1 = cs[i], c2 = cs[(i + 1) % 6];
      const sk = pk2(c1[0], c1[1]);
      if (!segMap.has(sk)) segMap.set(sk, []);
      segMap.get(sk).push({ x1: c1[0], y1: c1[1], x2: c2[0], y2: c2[1] });
    } }
  const used = new Set(); const loops = [];
  for (const arr of segMap.values()) for (const s0 of arr) {
    if (used.has(s0)) continue;
    const pts = [[s0.x1, s0.y1]]; let cur = s0;
    while (cur && !used.has(cur)) { used.add(cur);
      pts.push([cur.x2, cur.y2]);
      cur = (segMap.get(pk2(cur.x2, cur.y2)) || []).find((s) => !used.has(s)); }
    if (pts.length > 3) loops.push(pts);
  }
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  return loops.map((pts) => {
    const v = (pk2(...pts[0]) === pk2(...pts[pts.length - 1])) ? pts.slice(0, -1) : pts;
    const m = v.length;
    const mids = v.map((p, i) => mid(p, v[(i + 1) % m]));
    let d = `M${mids[0][0].toFixed(1)} ${mids[0][1].toFixed(1)}`;
    for (let i = 1; i <= m; i++) { const vi = v[i % m], mi = mids[i % m];
      d += `Q${vi[0].toFixed(1)} ${vi[1].toFixed(1)} ${mi[0].toFixed(1)} ${mi[1].toFixed(1)}`; }
    return d + 'Z';
  });
}
function reachSet(sid, depth) {
  const seen = new Set(MAP.sectors[sid].mapUnits.map((u) => u.q + ',' + u.r));
  let frontier = [...seen];
  for (let d = 0; d < depth; d++) {
    const nx = [];
    for (const k of frontier) {
      const [q, r] = k.split(',').map(Number);
      for (const [dq, dr] of EDGE_NB) {
        const nk = (q + dq) + ',' + (r + dr);
        if (!seen.has(nk) && hexOwn.has(nk)) { seen.add(nk); nx.push(nk); }
      } }
    frontier = nx;
  }
  return seen;
}

// ---- realms ----------------------------------------------------------------
const realms = Object.keys(BINDING);
const SELF = realms[0];
const regionToRealm = {};
for (const [realm, rids] of Object.entries(BINDING)) for (const rid of rids) regionToRealm[rid] = realm;
const realmOfSector = (sid) => regionToRealm[MAP.sectors[sid].regionId];
const isSelf = (sid) => realmOfSector(sid) === SELF;
const PALETTE = ['#4a86c8', '#c8524a', '#9a6fc8', '#c8934a', '#4ac89a'];
const realmTint = {}; realms.forEach((n, i) => realmTint[n] = PALETTE[i % PALETTE.length]);
const allSids = Object.keys(MAP.sectors);
const selfSids = allSids.filter(isSelf);
const enemySids = allSids.filter((s) => !isSelf(s));
const k = (n) => { n = Math.round(n);
  return n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(n); };

// ---- viewer-safe canned fiction (no hidden truth exists in this file) ------
const noise = (a, b, s = 0) => { let h = ((a * 73856093) ^ (b * 19349663) ^ (s * 83492791)) >>> 0;
  h = (h ^ (h >>> 13)) * 1274126177 >>> 0; return (h >>> 8) / 16777216; };
const FICT = {};
for (const sid of allSids) {
  const sec = MAP.sectors[sid]; const h0 = sec.mapUnits[0]; const mine = isSelf(sid);
  const pool = sec.populationValue * 30;
  if (mine) {
    const intensity = 0.44 + noise(h0.q, h0.r, 1) * 0.10;
    FICT[sid] = { mine, pool, intensity, conf: 1,
      garrison: 400 + sec.populationValue * 25,
      remaining: Math.round(pool * (1 - intensity)),
      fatigue: Math.round(noise(h0.q, h0.r, 4) * 45) };
  } else {
    const conf = 0.45 + noise(h0.q, h0.r, 2) * 0.45;
    const m = 600 + sec.economyValue * 40 + Math.round(noise(h0.q, h0.r, 3) * 400);
    const half = Math.round(m * (0.15 + (1 - (conf - 0.45) / 0.45) * 0.5) * 0.5);
    const iMid = 0.44 + noise(h0.q, h0.r, 1) * 0.12;
    const iHalf = 0.015 + (1 - conf) * 0.06;
    FICT[sid] = { mine, pool, conf,
      garrisonBand: [Math.max(0, m - half), m + half],
      intensityBand: [Math.max(0.42, iMid - iHalf), Math.min(0.58, iMid + iHalf)] };
  }
}
function provinceStat(rid) {
  const sids = MAP.regions.find((r) => r.id === rid).sectorIds;
  const mine = sids.every(isSelf);
  const tops = sids.map((s) => mine ? FICT[s].intensity : FICT[s].intensityBand[1]);
  const lows = sids.map((s) => mine ? FICT[s].intensity : FICT[s].intensityBand[0]);
  return { mine, sids, worst: Math.max(...tops), min: Math.min(...lows) };
}
// mobilization heat for variant C's always-on wash (0.42 ease .. 0.58 strain)
function intColor(v) { const t = Math.max(0, Math.min(1, (v - 0.42) / 0.16));
  const c1 = [90, 160, 110], c2 = [201, 80, 63], m = [227, 194, 74];
  const p = t < 0.5 ? c1.map((a, i) => Math.round(a + (m[i] - a) * t * 2))
    : m.map((a, i) => Math.round(a + (c2[i] - a) * (t - 0.5) * 2));
  return `rgb(${p[0]},${p[1]},${p[2]})`; }

function frontierPair() {
  for (const h of hexOwn.values()) {
    if (!isSelf(h.sid)) continue;
    const cs = corners(h.x, h.y);
    for (let i = 0; i < 6; i++) {
      const n = hexOwn.get((h.q + EDGE_NB[i][0]) + ',' + (h.r + EDGE_NB[i][1]));
      if (n && !isSelf(n.sid)) {
        const c1 = cs[i], c2 = cs[(i + 1) % 6];
        return { selfSid: h.sid, enemySid: n.sid,
          mid: [(c1[0] + c2[0]) / 2, (c1[1] + c2[1]) / 2] };
      }
    }
  }
}
const FP = frontierPair();
const selfFrontRid = MAP.sectors[FP.selfSid].regionId;
const enemyFrontRid = MAP.sectors[FP.enemySid].regionId;
const otherSelfRid = (BINDING[SELF] || []).find((r) => r !== selfFrontRid) || selfFrontRid;
const devSid = enemySids.find((s) => s !== FP.enemySid) || enemySids[0];
const homeSid = selfSids[Math.floor(selfSids.length / 2)];
const farEnemySid = enemySids[Math.min(9, enemySids.length - 1)];
function facingEdges(sidA, sidB) {
  const out = [];
  for (const u of MAP.sectors[sidA].mapUnits) {
    const h = hexOwn.get(u.q + ',' + u.r); const cs = corners(h.x, h.y);
    for (let i = 0; i < 6; i++) {
      const n = hexOwn.get((u.q + EDGE_NB[i][0]) + ',' + (u.r + EDGE_NB[i][1]));
      if (n && n.sid === sidB) out.push([cs[i], cs[(i + 1) % 6]]);
    } }
  return out;
}

// fortifications (PUB; canned): capitals III, cities II, frontier site I
const FORT = {};
for (const sid of Object.values(META.capitals)) FORT[sid] = 3;
for (const sid of Object.values(META.cities || {})) FORT[sid] = FORT[sid] || 2;
FORT[FP.selfSid] = FORT[FP.selfSid] || 1;

// ---- scenes ----------------------------------------------------------------
const SCENES = {
  1: { name: '조용한 턴', turn: 14, alarm: false, scars: [], warnProj: false,

      { tag: '위기', t: '위기 이정표 갱신 (뼈대)' },

// ---- variants --------------------------------------------------------------
const VARIANTS = {
  A: { label: 'A — 문 2 + 판세 렌즈 (군령 = 지도 원주민)', doors: ['staff', 'domestic'] },
  B: { label: 'B — 문 3 (군령 독립 문 · 상주 최소)', doors: ['staff', 'domestic', 'command'] },
  C: { label: 'C — 대조군: 전부 펼침 (전통 워게임 문법)', doors: [] },
};
const DOOR_NAME = { staff: '참모 보고', domestic: '내정', command: '군령' };

// ---- state -----------------------------------------------------------------
const qs = new URLSearchParams(location.search);
const state = {
  variant: VARIANTS[(qs.get('variant') || 'A').toUpperCase()] ? (qs.get('variant') || 'A').toUpperCase() : 'A',
  scene: ['1', '2', '3'].includes(qs.get('scene')) ? +qs.get('scene') : 1,
  lens: false, guide: true,
  card: null,
};
const SC = () => SCENES[state.scene];
const syncURL = () => { const u = new URL(location);
  u.searchParams.set('variant', state.variant); u.searchParams.set('scene', state.scene);
  history.replaceState({}, '', u); };

// ---- map render ------------------------------------------------------------
const svg = document.getElementById('map');
let vb = null;

function counterSvg(a) {
  const c = secCentroid(a.sid);
  const W = HEX * 3.1, H = HEX * 2.0, x = c.x - W / 2, y = c.y - H / 2;
  if (a.self) {
    return `<g pointer-events="none">
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${W}" height="${H}" rx="${HEX * 0.28}"
        fill="#2f6fb8" stroke="#eaf4ff" stroke-width="2.6"/>
      <line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x + W).toFixed(1)}" y2="${(y + H).toFixed(1)}" stroke="#eaf4ff" stroke-width="1.5" opacity=".45"/>
      <line x1="${(x + W).toFixed(1)}" y1="${y.toFixed(1)}" x2="${x.toFixed(1)}" y2="${(y + H).toFixed(1)}" stroke="#eaf4ff" stroke-width="1.5" opacity=".45"/>
      <text class="glyph" x="${c.x.toFixed(1)}" y="${(c.y + HEX * 0.32).toFixed(1)}"
        style="fill:#fff;font:700 ${(HEX * 0.85).toFixed(0)}px system-ui">${k(a.size)}</text>
      <text class="glyph" x="${c.x.toFixed(1)}" y="${(y + H + HEX * 0.75).toFixed(1)}"
        style="fill:#cfe6ff;font:700 ${(HEX * 0.55).toFixed(0)}px system-ui">아군</text></g>`;
  }
  const col = realmTint[realmOfSector(a.sid)];
  const f = FICT[a.sid]; const b = f.garrisonBand || [0, 0];
  return `<g pointer-events="none">
    <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${W}" height="${H}" rx="${HEX * 0.28}"
      fill="${col}" fill-opacity="0.22" stroke="${col}" stroke-width="2.4" stroke-dasharray="7 4"/>
    <text class="glyph" x="${c.x.toFixed(1)}" y="${(c.y + HEX * 0.38).toFixed(1)}"
      style="fill:#ffd9c9;font:700 ${(HEX * 1.0).toFixed(0)}px system-ui">?</text>
    <rect x="${(c.x - HEX * 1.9).toFixed(1)}" y="${(y - HEX * 1.15).toFixed(1)}" width="${HEX * 3.8}" height="${HEX * 0.95}" rx="${HEX * 0.2}" fill="#0e1420ee" stroke="${col}" stroke-width="1"/>
    <text class="glyph" x="${c.x.toFixed(1)}" y="${(y - HEX * 0.45).toFixed(1)}"
      style="fill:#ffd27f;font:700 ${(HEX * 0.58).toFixed(0)}px system-ui;stroke-width:0">${a.age}턴 전 목격</text>
    <text class="glyph" x="${c.x.toFixed(1)}" y="${(y + H + HEX * 0.8).toFixed(1)}"
      style="fill:#ffcf8a;font:700 ${(HEX * 0.6).toFixed(0)}px system-ui">${k(b[0])}–${k(b[1])}?</text></g>`;
}

function chipSvg(x, y, text, kind) {
  const COL = { t: ['#2a1512', '#a04838', '#ff9a8a', '▲'],
    o: ['#12220f', '#3f7a4a', '#8fd08a', '◆'],
    u: ['#121a28', '#46608a', '#9ab4d8', '?'] }[kind];
  const label = `${COL[3]} ${text}`;
  const w = HEX * 0.9 + label.length * HEX * 0.56;
  return `<g pointer-events="none">
    <rect x="${(x - w / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${(HEX * 1.05).toFixed(1)}"
      rx="${HEX * 0.3}" fill="${COL[0]}ee" stroke="${COL[1]}" stroke-width="1.4"/>
    <text x="${x.toFixed(1)}" y="${(y + HEX * 0.75).toFixed(1)}" text-anchor="middle"
      style="fill:${COL[2]};font:700 ${(HEX * 0.62).toFixed(0)}px system-ui">${label}</text></g>`;
}

// guide badges live on the map; the explanations stack in the fixed #guides
// column on the left (screen space — never overlaps itself, survives zoom)
function badge(n, x, y) {
  return `<g pointer-events="none">
    <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${HEX * 0.55}" fill="#ffd27f" stroke="#0009" stroke-width="1.8"/>
    <text x="${x.toFixed(1)}" y="${(y + HEX * 0.26).toFixed(1)}" text-anchor="middle"
      style="fill:#1a1408;font:800 ${(HEX * 0.68).toFixed(0)}px system-ui">${n}</text></g>`;
}
let lastCallouts = [];

function renderMap() {
  const sc = SC();
  const L = { sil: [], base: [], control: [], mob: [], border: [], coast: [], scar: [],
    dev: [], seat: [], cone: [], army: [], alarm: [], axes: [], label: [], focus: [], guide: [] };
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  const bump = (x, y) => { minX = Math.min(minX, x); minY = Math.min(minY, y);
    maxX = Math.max(maxX, x); maxY = Math.max(maxY, y); };

  // PUBLIC terrain
  for (const h of hexOwn.values()) { bump(h.x, h.y);
    const dv = ((h.q * 13 + h.r * 7) % 5 - 2) * 5;
    L.base.push(`<polygon points="${polyPts(h)}" fill="${tint(TERR[h.terr] || '#888', dv)}" data-sid="${h.sid}" data-key="${h.q},${h.r}"/>`); }
  const massifKeys = new Set((META.massif?.hexes || []).map((h) => h.q + ',' + h.r));
  const rangeKeys = new Set(META.rangeHexes.map((h) => h.q + ',' + h.r));
  for (const h of META.rangeHexes) { bump(h.x, h.y);
    if (massifKeys.has(h.q + ',' + h.r))
      L.base.push(`<polygon points="${polyPts(h)}" fill="#6b6156" stroke="#514840" stroke-width="1"/>`);
    else {
      L.base.push(`<polygon points="${polyPts(h)}" fill="${RANGE_FILL}" stroke="#2e2620" stroke-width="1"/>`);
      L.base.push(`<text x="${h.x.toFixed(1)}" y="${(h.y + 4).toFixed(1)}" text-anchor="middle" style="fill:#6d5c49;font-size:12px">▲</text>`);
    } }
  if (META.massif) { const m = META.massif;
    L.label.push(`<text x="${m.cx}" y="${m.cy + 9}" text-anchor="middle" style="font-size:26px;fill:#a99a85;paint-order:stroke;stroke:#0006;stroke-width:2px">▲</text>`);
    L.label.push(`<text x="${m.cx}" y="${m.cy + 26}" text-anchor="middle" style="font:600 10px system-ui;fill:#cfc2ae;paint-order:stroke;stroke:#0008;stroke-width:2px">${m.label}</text>`); }

  // PUBLIC control wash
  const washOp = state.lens ? 0.38 : 0.18;
  for (const h of hexOwn.values())
    L.control.push(`<polygon points="${polyPts(h)}" fill="${realmTint[realmOfSector(h.sid)]}" opacity="${washOp}" pointer-events="none"/>`);

  // variant C only: always-on mobilization wash + % labels (v0's failure mode
  // deliberately resurrected as the control group)
  if (state.variant === 'C') {
    for (const reg of MAP.regions) {
      const st = provinceStat(reg.id);
      for (const s of st.sids) for (const u of MAP.sectors[s].mapUnits) {
        const h = hexOwn.get(u.q + ',' + u.r);
        L.mob.push(`<polygon points="${polyPts(h)}" fill="${intColor(st.worst)}" opacity="0.30" pointer-events="none"/>`);
      }
    }
  }

  // borders
  const chokeMid = {};
  for (const h of hexOwn.values()) { const cs = corners(h.x, h.y);
    for (let i = 0; i < 6; i++) {
      const nk = (h.q + EDGE_NB[i][0]) + ',' + (h.r + EDGE_NB[i][1]);
      const n = hexOwn.get(nk);
      const c1 = cs[i], c2 = cs[(i + 1) % 6];
      const seg = (col, w, dash) =>
        L.border.push(`<line x1="${c1[0].toFixed(1)}" y1="${c1[1].toFixed(1)}" x2="${c2[0].toFixed(1)}" y2="${c2[1].toFixed(1)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"${dash ? ` stroke-dasharray="${dash}"` : ''} pointer-events="none"/>`);
      if (!n) { if (rangeKeys.has(nk)) seg('#0a1c26', 3); continue; }
      if (n.rid !== h.rid) {
        if (h.rid > n.rid) continue;
        const pk = pairKey(h.rid, n.rid);
        const cls = META.pairClass[pk] || 'open';
        const st = CLS_STYLE[cls];
        const hk = h.q + ',' + h.r;
        const pr = META.partialRivers && META.partialRivers[pk];
        if (pr && (pr.includes(hk + '|' + nk) || pr.includes(nk + '|' + hk)))
          seg(CLS_STYLE.river[0], CLS_STYLE.river[1]);
        else if (st) seg(st[0], st[1]); else seg('#1c2b18', 2.5);
        if (regionToRealm[h.rid] !== regionToRealm[n.rid]) seg('#0b0f08', 2.2);
        const m = chokeMid[pk] || (chokeMid[pk] = [0, 0, 0]);
        m[0] += (c1[0] + c2[0]) / 2; m[1] += (c1[1] + c2[1]) / 2; m[2]++;
      } else if (n.sid !== h.sid && h.sid < n.sid) seg('#0b0f0870', 1.6, '5 4');
    } }
  for (const [pk, m] of Object.entries(chokeMid)) {
    const cls = META.pairClass[pk];
    if (!DOORCAP[cls]) continue;
    L.label.push(`<text class="choke" x="${(m[0] / m[2]).toFixed(1)}" y="${(m[1] / m[2]).toFixed(1)}">${cls}${DOORCAP[cls]}</text>`);
  }
  for (const e of MAP.edges) {
    if (e.choke.class !== 'strait') continue;
    const ca = secCentroid(e.a), cb = secCentroid(e.b);
    L.label.push(`<line x1="${ca.x}" y1="${ca.y}" x2="${cb.x}" y2="${cb.y}" stroke="#7fd0e8" stroke-width="2.5" stroke-dasharray="3 7" opacity=".8" pointer-events="none"/>`);
    L.label.push(`<text class="choke" x="${((ca.x + cb.x) / 2).toFixed(1)}" y="${((ca.y + cb.y) / 2 - 6).toFixed(1)}" style="fill:#9fe0f5">strait${e.choke.cap}</text>`);
  }

  // smoothed silhouette
  const cellPts = new Map();
  for (const h of hexOwn.values()) cellPts.set(h.q + ',' + h.r, h);
  for (const h of META.rangeHexes) cellPts.set(h.q + ',' + h.r, h);
  const ds = loopsD(cellPts);
  const stroke = (col, w, op) => ds.map((d) =>
    `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round"${op ? ` opacity="${op}"` : ''} pointer-events="none"/>`).join('');
  L.sil.push(stroke('#1d4056', 16, '.5'));
  L.coast.push(stroke('#102733', 8));
  L.coast.push(stroke('#0a1c26', 3));

  // SCAR
  for (const sid of sc.scars) {
    for (const u of MAP.sectors[sid].mapUnits) { const h = hexOwn.get(u.q + ',' + u.r);
      L.scar.push(`<polygon points="${polyPts(h)}" fill="url(#scar)" opacity="0.8" pointer-events="none"/>`); }
    const c = secCentroid(sid);
    L.scar.push(`<rect x="${(c.x - HEX * 2.1).toFixed(1)}" y="${(c.y - HEX * 2.6).toFixed(1)}" width="${HEX * 4.2}" height="${HEX * 1.0}" rx="${HEX * 0.2}" fill="#2a130cee" stroke="#a05a3a" stroke-width="1.2" pointer-events="none"/>`);
    L.scar.push(`<text class="glyph" x="${c.x.toFixed(1)}" y="${(c.y - HEX * 1.85).toFixed(1)}" style="fill:#e8b49a;font:700 ${(HEX * 0.58).toFixed(0)}px system-ui;stroke-width:0">상흔 +1 · 영구</text>`);
  }

  // DEV placeholder
  for (const u of MAP.sectors[devSid].mapUnits) { const h = hexOwn.get(u.q + ',' + u.r);
    L.dev.push(`<polygon points="${polyPts(h)}" fill="url(#hatch)" opacity="0.85" pointer-events="none"/>`); }
  { const c = secCentroid(devSid);
    L.dev.push(`<rect x="${(c.x - 42).toFixed(1)}" y="${(c.y - 8).toFixed(1)}" width="84" height="16" rx="3" fill="#1b1024" stroke="#a05ad0" stroke-width="1" pointer-events="none"/>`);
    L.dev.push(`<text class="glyph" x="${c.x.toFixed(1)}" y="${(c.y + 4).toFixed(1)}" style="fill:#d9a8f0;font:700 9px system-ui;stroke-width:0">DEV — 미구현</text>`); }

  // seats + forts
  for (const sid of Object.values(META.capitals)) { const c = secCentroid(sid);
    L.seat.push(`<text class="cap glyph" x="${c.x.toFixed(1)}" y="${(c.y + 4).toFixed(1)}" style="font-size:${state.lens ? 20 : 14}px">★</text>`); }
  for (const sid of Object.values(META.cities || {})) { const c = secCentroid(sid);
    L.seat.push(`<text class="cap glyph" x="${c.x.toFixed(1)}" y="${(c.y + 5).toFixed(1)}" style="font-size:15px">◉</text>`); }
  for (const [sid, g] of Object.entries(FORT)) { const c = secCentroid(sid);
    for (let i = 0; i < g; i++)
      L.seat.push(`<rect x="${(c.x - HEX * 0.5 + i * HEX * 0.38).toFixed(1)}" y="${(c.y + HEX * 0.55).toFixed(1)}" width="${HEX * 0.3}" height="${HEX * 0.3}" fill="#d8c9a8" stroke="#0009" stroke-width="0.8" pointer-events="none"/>`); }

  // ARMIES: enemy reach cone (shaded reachable hexes) under both counters
  const fogOp = state.lens ? ' opacity="0.35"' : '';
  for (const a of sc.armies) {
    if (a.self) continue;
    const col = realmTint[realmOfSector(a.sid)];
    const cone = reachSet(a.sid, 1 + a.age);
    const coneMap = new Map([...cone].map((key) => [key, hexOwn.get(key)]));
    const dsC = loopsD(coneMap);
    L.cone.push(`<g${fogOp} pointer-events="none">` + dsC.map((d) =>
      `<path d="${d}" fill="${col}" fill-opacity="0.13" stroke="${col}" stroke-width="2.4" stroke-dasharray="8 5" opacity=".85"/>`).join('') + `</g>`);
  }
  for (const a of sc.armies) L.army.push(`<g${fogOp}>${counterSvg(a)}</g>`);

  // BORDER ALARM: the border line itself pulses + a heading arrow
  if (sc.alarm) {
    const edges = facingEdges(FP.selfSid, FP.enemySid);
    const glow = edges.map(([c1, c2]) =>
      `<line x1="${c1[0].toFixed(1)}" y1="${c1[1].toFixed(1)}" x2="${c2[0].toFixed(1)}" y2="${c2[1].toFixed(1)}" stroke="#ff5a5a" stroke-width="${HEX * 0.6}" stroke-linecap="round"/>`).join('');
    const core = edges.map(([c1, c2]) =>
      `<line x1="${c1[0].toFixed(1)}" y1="${c1[1].toFixed(1)}" x2="${c2[0].toFixed(1)}" y2="${c2[1].toFixed(1)}" stroke="#ff8a6a" stroke-width="4" stroke-linecap="round"/>`).join('');
    const [mx, my] = FP.mid;
    const ce = secCentroid(FP.enemySid), cs2 = secCentroid(FP.selfSid);
    const ang = Math.atan2(cs2.y - ce.y, cs2.x - ce.x) * 180 / Math.PI;
    L.alarm.push(`<g pointer-events="none"><g class="aglow">${glow}</g>${core}
      <g transform="translate(${mx.toFixed(1)} ${my.toFixed(1)}) rotate(${ang.toFixed(0)})">
        <path d="M ${-HEX * 1.2} 0 L ${HEX * 1.5} 0 M ${HEX * 0.7} ${-HEX * 0.6} L ${HEX * 1.6} 0 L ${HEX * 0.7} ${HEX * 0.6}"
          stroke="#ff6a5a" stroke-width="${HEX * 0.28}" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
      <rect x="${(mx - HEX * 3.4).toFixed(1)}" y="${(my + HEX * 1.2).toFixed(1)}" width="${HEX * 6.8}" height="${HEX * 1.05}" rx="${HEX * 0.22}" fill="#2a1210ee" stroke="#ff5a5a" stroke-width="1.2"/>
      <text class="glyph" x="${mx.toFixed(1)}" y="${(my + HEX * 1.95).toFixed(1)}" style="fill:#ff9a8a;font:700 ${(HEX * 0.58).toFixed(0)}px system-ui;stroke-width:0">국경 경보 — 존재+방향만</text></g>`);
  }

  // SITUATION HINT CHIPS (worded, sparse; hidden under lens)
  if (!state.lens) for (const [rid, ax] of Object.entries(sc.axes)) {
    const c = META.regionCenters[rid]; if (!c) continue;
    let i = 0;
    for (const kind of ['t', 'o', 'u']) {
      if (!ax[kind]) continue;
      L.axes.push(chipSvg(c.x, c.y + HEX * 0.7 + i * HEX * 1.25, ax[kind], kind));
      i++;
    } }

  // province labels (+ C-variant mobilization %)
  for (const r of MAP.regions) { const c = META.regionCenters[r.id];
    L.label.push(`<text class="rlabel" data-rid="${r.id}" x="${c.x.toFixed(1)}" y="${c.y.toFixed(1)}">${r.name}</text>`);
    if (state.variant === 'C') { const st = provinceStat(r.id);
      L.label.push(`<text class="glyph" x="${c.x.toFixed(1)}" y="${(c.y - HEX * 1.1).toFixed(1)}" style="fill:#fff;font:700 ${(HEX * 0.6).toFixed(0)}px system-ui">동원 ${st.mine ? '' : '~'}${(st.worst * 100).toFixed(0)}%</text>`); } }

  // focus highlight
  const fc = state.card;
  if (fc && (fc.t === 'province' || fc.t === 'sector')) {
    const rid = fc.t === 'province' ? fc.rid : MAP.sectors[fc.sid].regionId;
    const reg = MAP.regions.find((r) => r.id === rid);
    if (reg) for (const sid of reg.sectorIds) for (const u of MAP.sectors[sid].mapUnits) {
      const h = hexOwn.get(u.q + ',' + u.r);
      L.focus.push(`<polygon points="${polyPts(h)}" fill="#ffffff" opacity="0.06" pointer-events="none"/>`); }
    if (fc.t === 'sector') for (const u of MAP.sectors[fc.sid].mapUnits) {
      const h = hexOwn.get(u.q + ',' + u.r);
      L.focus.push(`<polygon points="${polyPts(h)}" fill="none" stroke="#ffec6e" stroke-width="2.5" pointer-events="none"/>`); }
  }

  // GUIDED CALLOUTS — numbered badge on the mark, explanation card in the
  // fixed left column (#guides). No floating boxes on the map itself.
  lastCallouts = [];
  if (state.guide && state.variant !== 'C') {
    const own = sc.armies.find((a) => a.self); const oc = secCentroid(own.sid);
    const cos = [];
    if (state.scene === 1) {
      const ec = secCentroid(farEnemySid);
      cos.push([oc.x, oc.y - HEX * 1.6, '아군 야전군',
        `파란 말이 내 부대예요. 숫자 <b>${k(own.size)}</b>는 <b>정확값</b> — 내 것은 항상 정확해요.`, null]);
      cos.push([ec.x, ec.y - HEX * 1.9, '적 야전군 — 3턴 전 목격',
        `물음표 말은 <b>마지막 목격 지점</b>. 주변 점선 영역이 <b>지금 있을 수 있는 모든 곳</b> — 오래될수록 넓어져요.`,
        '적이 어디쯤인지 감이 오나요?']);
      const ac = META.regionCenters[enemyFrontRid];
      if (ac) cos.push([ac.x - HEX * 2.2, ac.y + HEX * 1.2, '형세 힌트 (최상층)',
        `지도 최상층엔 이런 <b>결론 칩</b>만 둡니다. 원시 수치는 전부 클릭 안쪽에.`,
        'L0가 이 정도로 성긴 것, 편한가요 허전한가요?']);
    } else if (state.scene === 2) {
      const ec = secCentroid(FP.enemySid);
      cos.push([FP.mid[0] - HEX * 1.2, FP.mid[1], '국경 경보',
        `국경선 자체가 울립니다. <b>누가·얼마나는 모름</b> — 존재와 방향만 알려줘요.`,
        '위급함이 한눈에 오나요?']);
      cos.push([ec.x + HEX * 1.9, ec.y - HEX * 1.2, '적 야전군 — 1턴 전 목격',
        `최근 목격이라 <b>가능 영역이 좁아요</b>. 정찰이 신선할수록 좁아집니다. 병력은 <b>범위로만</b> — 가운데 값은 없어요.`,
        '정확값(아군)과 추정(적)이 구분되나요?']);
      cos.push([oc.x - HEX * 1.9, oc.y - HEX * 1.3, '아군 — 정확값',
        `경보 지점에 내 부대 <b>${k(own.size)}</b>가 서 있어요.`, null]);
    } else {
      const scx = secCentroid(FP.selfSid);
      cos.push([scx.x - HEX * 2.3, scx.y - HEX * 2.4, '상흔 — 땅은 기억한다',
        `전투가 지나간 땅은 <b>영구히</b> 흉터가 남아요. 지도가 곧 이 매치의 역사서.`,
        '세계가 변한 게 느껴지나요?']);
      const ec = secCentroid(FP.enemySid);
      cos.push([ec.x + HEX * 1.9, ec.y - HEX * 1.2, '적 후퇴 — 방금 목격',
        `0턴 전 목격 → 가능 영역이 최소. <b>추격 창</b>이 열린 상태예요.`, null]);
    }
    cos.forEach(([bx, by, t, b, ask], i) => {
      L.guide.push(badge(i + 1, bx, by));
      lastCallouts.push({ n: i + 1, t, b, ask });
    });
  }

  if (!vb) { const pad = HEX * 2.2;
    vb = { x: minX - pad, y: minY - pad, w: maxX - minX + pad * 2, h: maxY - minY + pad * 2 }; }
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  svg.innerHTML = `<defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#160c22"/><line x1="0" y1="0" x2="0" y2="7" stroke="#7a4aa8" stroke-width="2"/></pattern>
    <pattern id="scar" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M0 9 L9 0" stroke="#2e150e" stroke-width="2.4"/><path d="M0 3.5 L3.5 0" stroke="#2e150e" stroke-width="1.3"/></pattern>
  </defs>` + L.sil.join('') + L.base.join('') + L.control.join('') + L.mob.join('')
    + L.border.join('') + L.coast.join('') + L.scar.join('') + L.dev.join('')
    + L.seat.join('') + L.cone.join('') + L.army.join('') + L.alarm.join('')
    + L.axes.join('') + L.label.join('') + L.focus.join('') + L.guide.join('');
}

// ---- HUD -------------------------------------------------------------------
function renderHud() {
  const sc = SC();
  document.getElementById('turnchip').innerHTML =
    `턴 <b>${sc.turn}</b> · <b>${sc.name}</b> · 위기 개시 T32 <span style="color:#8a93a0">(공개 달력)</span>`;
  const chips = [`<span class="chip">자국 <b style="color:${realmTint[SELF]}">${SELF}</b></span>`,
    `<span class="chip">국고 <b>1,240</b></span>`];
  if (state.variant !== 'B') {
    chips.push(`<span class="chip">커밋 풀 <b>3/5</b></span>`);
    chips.push(`<span class="chip${sc.warnProj ? ' warn' : ''}">투사 질량 <b>4,800</b>${sc.warnProj ? ' ⚠ 바닥' : ''}</span>`);
  }
  document.getElementById('strip').innerHTML = chips.join('');
  const doors = VARIANTS[state.variant].doors.map((d) => {
    const active = state.card && state.card.t === 'door-' + d;
    const badge = (d === 'command' && sc.warnProj) ? ' <span class="b">⚠</span>' : '';
    return `<button data-door="${d}" class="${active ? 'active' : ''}">${DOOR_NAME[d]}${badge}</button>`;
  });
  doors.push(`<button id="lensbtn" class="lens ${state.lens ? 'active' : ''}">판세 렌즈</button>`);
  document.getElementById('doors').innerHTML = doors.join('');
  document.getElementById('doorcall').style.display =
    (state.guide && state.variant !== 'C' && !state.card) ? 'block' : 'none';
  document.getElementById('guidebtn').classList.toggle('on', state.guide);
  // guide explanation column (left) — cards keyed to the map badges
  const gEl = document.getElementById('guides');
  if (state.guide && state.variant !== 'C' && lastCallouts.length) {
    gEl.style.display = 'flex';
    gEl.innerHTML = lastCallouts.map((c) =>
      `<div class="cobox"><b><span class="n">${c.n}</span>${c.t}</b><br>${c.b}${c.ask ? `<div class="coask">질문 — ${c.ask}</div>` : ''}</div>`).join('');
  } else { gEl.style.display = 'none'; gEl.innerHTML = ''; }
}

// ---- door bodies (shared by summoned cards and variant-C fixed panels) -----
const skel = `<span class="skel">뼈대 — 값은 더미</span>`;
const row = (g, body, bc) =>
  `<div class="row"${bc ? ` style="border-left-color:${bc}"` : ''}><span class="g">${g}</span><br>${body}</div>`;

function staffBody() {
  const sc = SC();
  const items = sc.tray.map((i) =>
    `<div class="tray-item"><span class="tag${i.alarm ? ' alarm' : ''}">${i.tag}</span><span>${i.t}</span></div>`).join('');
  return `<div class="gist">요지 — ${sc.gist}</div>
    <div class="offrow">
      <div class="officer on"><i></i>부관</div><div class="officer"><i></i>공세</div>
      <div class="officer"><i></i>수세</div><div class="officer"><i></i>기동</div>
      <div class="officer"><i></i>내치</div></div>
    <p class="sub">참모진 브리핑(②층 첫 입주 후보) 자리 — 본체는 별도 pass. 지금은 부관 요지만.</p>
    <h2>사건 트레이 (순서 보존 · 즉시 건너뛰기)</h2>${items}
    <div class="stub">▸ 한 단계씩 · ▸▸ 자동 재생 · ⏭ 건너뛰기 (뼈대 — 페이싱은 표현 선택)</div>
    <h2>교전 보고</h2>
    ${sc.scars.length ? row('결전 결과 (showdown 공개)', `<b>승리</b> — ${nameOf[selfFrontRid]} · <span class="g">공개 범위 gate 08 미결 (뼈대)</span>`)
      : `<p class="sub">이번 턴 교전 없음</p>`}
    <h2>위기 이정표 (public 달력)</h2>
    ${row('위기 달력', `개시 <b>T32</b> · 현재 T${sc.turn} · 단계 0/3`)}`;
}

function domesticBody() {
  const remSum = selfSids.reduce((a, s) => a + FICT[s].remaining, 0);
  const poolSum = selfSids.reduce((a, s) => a + FICT[s].pool, 0);
  const pctRem = Math.round(remSum / poolSum * 100);
  const provs = (BINDING[SELF] || []).map((rid) => {
    const st = provinceStat(rid); const w = Math.round((st.worst - 0.42) / 0.16 * 100);
    return `<div style="margin:5px 0"><span style="font-size:11.5px">${nameOf[rid]} <span class="g">최악 ${(st.worst * 100).toFixed(0)}%</span></span>
      <div class="meter"><i style="width:${w}%;background:${intColor(st.worst)}"></i></div></div>`;
  }).join('');
  return `<h2>국고 흐름</h2>${row('잔고 1,240', `수입 <span class="exact">+180</span> · 지출 <span style="color:#d98a8a;font-weight:700">−140</span> /턴 (뼈대)`)}
    <h2>징집 명부 (자국 총계)</h2>
    ${row('남음 (exact)', `<span class="exact">${remSum.toLocaleString()}</span> <span class="g">/ pool ${poolSum.toLocaleString()}</span>
      <div class="meter"><i style="width:${pctRem}%"></i></div>`)}
    <h2>동원 강도 — 지방별</h2>${provs}
    <div class="stub">다음 동원령 견적 — 명부 −1,800/점 · 확정 전 정확 견적 (뼈대)</div>
    <div class="stub">M10 누설 미리보기 — 이웃이 보게 될 존 밴드 (뼈대)</div>`;
}

function commandBody() {
  const sc = SC();
  const armies = sc.armies.filter((a) => a.self).map((a) =>
    `<div class="srow" data-open-sid="${a.sid}"><b>야전군</b><span class="g">${nameOf[MAP.sectors[a.sid].regionId]} · ${a.sid}</span><span class="exact" style="margin-left:auto">${a.size.toLocaleString()}</span></div>`).join('');
  return `<h2>커밋 · 투사</h2>
    ${row('커밋 풀 (턴당 재생성 · 비축 불가)', `<span class="pips"><span class="f">●●●</span><span class="e">●●</span></span> <b>3/5</b>`)}
    ${row('투사 가능 질량', `<b>4,800</b>${sc.warnProj ? ' <span style="color:#ffb09a">⚠ 바닥 경고</span>' : ''}
      <div class="meter"><i style="width:${sc.warnProj ? 18 : 55}%;background:${sc.warnProj ? '#c9503f' : '#5aa06e'}"></i><span class="tick" style="left:15%"></span></div>`)}
    <h2>야전군 (행 클릭 = 해당 섹터)</h2>${armies}
    ${row('긴장 밴드 (command card)', `<span class="g">뼈대 자리만</span>`)}
    <div class="stub">명령 조립 — 표적 지목 후 커밋 배분 (뼈대)</div>`;
}

function panseBody() {
  return `${row('판세 (밴드로만 읽음 · 막대 금지)', `<b style="font-size:15px">균형</b> — <span class="band">[열세 상단 ~ 우세 하단]</span>
      <br><span class="g">밴드 폭 = 인식 불확실성(실체 추정 + 국고)만 · 전략 미지수는 전투 미리보기 소관</span>`)}
    <h2>결정점 산술 기여 (뼈대)</h2>
    ${row('아국 영토 가치 합', `… <span class="g">(뼈대)</span>`)}
    ${row('최대 적국', `${realms[1] || '—'} … <span class="g">(뼈대)</span>`)}
    ${row('잠재 연합 저울', `… <span class="g">(뼈대)</span>`)}`;
}

// ---- summoned card ---------------------------------------------------------
const cardEl = document.getElementById('card');

function axisChips(rid) {
  const ax = SC().axes[rid];
  if (!ax) return `<span class="sub">축 조용 — 표시할 힌트 없음</span>`;
  const M = { t: ['axis t', '▲ 위협'], o: ['axis o', '◆ 기회'], u: ['axis u', '? 불확실'] };
  return Object.entries(ax).map(([kk, v]) =>
    `<span class="${M[kk][0]}">${M[kk][1]} · ${v}</span>`).join('');
}
function rangeBar(lo, hi) {
  const max = hi * 1.3;
  const l = lo / max * 100, w = (hi - lo) / max * 100;
  return `<div class="range"><div class="rail"></div><div class="seg" style="left:${l.toFixed(0)}%;width:${Math.max(3, w).toFixed(0)}%"></div></div>
    <div class="range-l" style="padding-left:${Math.max(0, l - 6).toFixed(0)}%;padding-right:${Math.max(0, 100 - l - w - 8).toFixed(0)}%"><span>${lo.toLocaleString()}</span><span>${hi.toLocaleString()}</span></div>`;
}

function provinceCard(rid) {
  const reg = MAP.regions.find((r) => r.id === rid);
  const realm = regionToRealm[rid]; const mine = realm === SELF;
  const st = provinceStat(rid);
  const pct = (v) => (v * 100).toFixed(0) + '%';
  const srows = reg.sectorIds.map((sid) => {
    const sec = MAP.sectors[sid]; const f = FICT[sid];
    const fort = FORT[sid] ? ` 요새${'▪'.repeat(FORT[sid])}` : '';
    const troops = f.mine ? `<span class="exact">${f.garrison.toLocaleString()}</span>`
      : `<span class="band">[${k(f.garrisonBand[0])}–${k(f.garrisonBand[1])}]</span>`;
    return `<div class="srow" data-open-sid="${sid}"><b>${sid}</b><span class="g">${sec.mapUnits[0].terrainLayer}${fort}</span><span style="margin-left:auto">${troops}</span></div>`;
  }).join('');
  return `<h1>${reg.name} <span style="color:${realmTint[realm]}">●</span> <span class="g" style="font-weight:400">${realm} · ${reg.sectorIds.length}개 섹터</span><button class="x">✕</button></h1>
    <p class="sub">L1 — 지방 카드 (지목→소환 · 상주 아님)</p>
    <h2>형세 축</h2>${axisChips(rid)}
    <h2>동원 강도 — 지방 요약</h2>
    ${row(mine ? '최악 섹터 (exact)' : '최악 섹터 (밴드 상단 · 캐주얼 1차)',
      `<b style="font-size:15px" class="${mine ? 'exact' : 'band'}">${mine ? '' : '~'}${pct(st.worst)}</b>
       <br><span class="g">분포 ${pct(st.min)} – ${pct(st.worst)} · ${st.sids.length}개 섹터 (헤비 2차)</span>`)}
    <h2>섹터 (행 클릭 = 드릴)</h2>${srows}`;
}

function sectorCard(sid) {
  const sec = MAP.sectors[sid]; const rid = sec.regionId;
  const realm = regionToRealm[rid]; const f = FICT[sid];
  const fort = FORT[sid] ? `요새 ${'▪'.repeat(FORT[sid])}` : '요새 없음';
  const army = SC().armies.find((a) => a.sid === sid && !a.self);
  const scarred = SC().scars.includes(sid);
  const rows = [];
  rows.push(row('공개 지리 (public)', `<b>${sec.mapUnits[0].terrainLayer}</b> · ${fort} · ${sec.mapUnits.length} hex · econ ${sec.economyValue} · pop ${sec.populationValue}`));
  if (f.mine) {
    rows.push(row('주둔 병력 (exact)', `<span class="exact">${f.garrison.toLocaleString()}</span>`, '#3f7a4a'));
    rows.push(row('피로 (exact — 뼈대 눈금)', `<span class="exact">${f.fatigue}</span> / 100
      <div class="meter"><i style="width:${f.fatigue}%;background:#a08a3a"></i></div>`));
    rows.push(row('동원 강도 (exact · 섹터 귀속)', `<span class="exact">${(f.intensity * 100).toFixed(1)}%</span>`));
    rows.push(row('징집 명부 남음 (focus 상세)', `<span class="exact">${f.remaining.toLocaleString()}</span> <span class="g">/ pool ${f.pool.toLocaleString()}</span>`));
    rows.push(row('상흔 · 봉기 연료', scarred
      ? `<b style="color:#e8b49a">상흔 +1 (영구 — 땅은 기억한다)</b> · 연료 상승 (뼈대)`
      : `<span class="g">상흔 없음</span>`));
    rows.push(state.variant === 'A'
      ? `<div class="stub">명령 조립 — 이 섹터를 표적으로 (뼈대 · A안: 지도 원주민)</div>`
      : `<div class="stub">명령 조립은 <b>군령 문</b>에서 (B안)</div>`);
  } else {
    const b = f.garrisonBand;
    rows.push(row(`적 병력 — 추정 범위 · 신뢰도 ${(f.conf * 100).toFixed(0)}%`,
      rangeBar(b[0], b[1]) + `<span class="g">끝점만 읽을 것 — 가운데 값은 없다 (폭이 곧 불확실성)</span>`, '#a07838'));
    rows.push(row('동원 강도 — 파생 범위 (섹터 귀속)',
      `<span class="band">[${(f.intensityBand[0] * 100).toFixed(0)}% – ${(f.intensityBand[1] * 100).toFixed(0)}%]</span>`));
    rows.push(row('징집 명부 — 파생 범위',
      `<span class="band">[${k(Math.round(f.pool * (1 - f.intensityBand[1])))} – ${k(Math.round(f.pool * (1 - f.intensityBand[0])))}]</span> <span class="g">/ pool ${f.pool.toLocaleString()} (public)</span>`));
    if (army) rows.push(row('적 야전군 — last seen',
      `<b class="band">${army.age}턴 전</b> 목격 · 점선 영역 = 가능 위치 전체 <span class="g">(점유 아님)</span>`, '#a07838'));
    rows.push(row('태세 · 커밋 배분 · 국고',
      `<span class="absent">정보 없음 — 정찰로도 알 수 없음 (교전 시 공개)</span>`, '#7a3a3a'));
    if (sid === devSid) rows.push(row('DEV', `<span style="color:#d9a8f0">이 섹터는 미구현 표식 시연용 — 기능 Fog 대체 아님</span>`, '#7a4aa8'));
  }
  return `<h1><button class="back" data-back-rid="${rid}">‹ ${nameOf[rid]}</button>
      <b>${sid}</b> <span style="color:${realmTint[realm]}">●</span><button class="x">✕</button></h1>
    <p class="sub">L2 — 섹터 카드 (증거 층)</p>${rows.join('')}`;
}

function renderCard() {
  const c = state.card;
  if (!c) { cardEl.className = ''; cardEl.innerHTML = ''; return; }
  cardEl.className = 'open';
  const doorCard = (t, body, sub) => `<h1>${t} ${skel}<button class="x">✕</button></h1>${sub ? `<p class="sub">${sub}</p>` : ''}${body}`;
  cardEl.innerHTML =
    c.t === 'province' ? provinceCard(c.rid) :
    c.t === 'sector' ? sectorCard(c.sid) :
    c.t === 'door-staff' ? doorCard('참모 보고', staffBody(), '가설: 사건 트레이 + 교전 보고 + 위기 이정표를 한 문이 흡수') :
    c.t === 'door-domestic' ? doorCard('내정', domesticBody(), '상황 케이던스(S) 값들의 문 — 매턴 흘깃값은 밖에 산다') :
    c.t === 'door-command' ? doorCard('군령', commandBody(), 'B안 전용 문 — A안에서는 상주 스트립 + 지도에 산다') :
    c.t === 'panse' ? doorCard('판세', panseBody(), 'match-level 밴드 읽기 — 렌즈 지도 효과: 통제 강조 + 수도 확대') : '';
}

function renderPanels() {
  const on = state.variant === 'C';
  for (const id of ['panelL', 'panelR', 'panelR2'])
    document.getElementById(id).style.display = on ? 'block' : 'none';
  if (!on) return;
  document.getElementById('panelL').innerHTML = `<h1>내정 ${skel}</h1>` + domesticBody()
    + `<h1 style="margin-top:14px">판세 ${skel}</h1>` + panseBody();
  document.getElementById('panelR').innerHTML = `<h1>참모 보고 ${skel}</h1>` + staffBody();
  document.getElementById('panelR2').innerHTML = `<h1>군령 ${skel}</h1>` + commandBody();
}

// ---- draw + wiring ---------------------------------------------------------
function draw() {
  renderMap(); renderHud(); renderCard(); renderPanels(); syncURL();
  document.getElementById('vlabel').textContent = VARIANTS[state.variant].label;
  document.querySelectorAll('#harness [data-scene]').forEach((b) =>
    b.classList.toggle('on', +b.dataset.scene === state.scene));
}
function openCard(c) { state.card = c; if (c && c.t !== 'panse') state.lens = false; draw(); }

let moved = false;
svg.addEventListener('click', (e) => {
  if (moved) return;
  const d = e.target.dataset || {};
  if (d.rid && !d.sid) { openCard({ t: 'province', rid: d.rid }); return; }
  if (!d.sid) return;
  const rid = MAP.sectors[d.sid].regionId;
  const c = state.card;
  if (c && (c.t === 'province' && c.rid === rid || c.t === 'sector' && MAP.sectors[c.sid].regionId === rid))
    openCard({ t: 'sector', sid: d.sid });
  else openCard({ t: 'province', rid });
});
document.getElementById('doors').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'lensbtn') { state.lens = !state.lens;
    state.card = state.lens ? { t: 'panse' } : (state.card && state.card.t === 'panse' ? null : state.card);
    draw(); return; }
  const d = b.dataset.door; if (!d) return;
  const t = 'door-' + d;
  openCard(state.card && state.card.t === t ? null : { t });
});
document.body.addEventListener('click', (e) => {
  if (e.target.closest('#card .x')) { if (state.card?.t === 'panse') state.lens = false; openCard(null); return; }
  const back = e.target.closest('[data-back-rid]');
  if (back) { openCard({ t: 'province', rid: back.dataset.backRid }); return; }
  const sr = e.target.closest('[data-open-sid]');
  if (sr) openCard({ t: 'sector', sid: sr.dataset.openSid });
});

const vOrder = Object.keys(VARIANTS);
const shift = (d) => { state.variant = vOrder[(vOrder.indexOf(state.variant) + d + vOrder.length) % vOrder.length];
  if (state.variant !== 'B' && state.card?.t === 'door-command') state.card = null;
  draw(); };
document.getElementById('prev').onclick = () => shift(-1);
document.getElementById('next').onclick = () => shift(1);
document.querySelectorAll('#harness [data-scene]').forEach((b) =>
  b.onclick = () => { state.scene = +b.dataset.scene; draw(); });
document.getElementById('guidebtn').onclick = () => { state.guide = !state.guide; draw(); };
document.getElementById('zreset').onclick = () => { vb = null; draw(); };
addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName)) return;
  if (e.key === 'ArrowLeft') shift(-1);
  if (e.key === 'ArrowRight') shift(1);
  if (['1', '2', '3'].includes(e.key)) { state.scene = +e.key; draw(); }
  if (e.key === 'Escape') { if (state.card?.t === 'panse') state.lens = false; openCard(null); }
});

function svgPt(e) { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse()); }
svg.addEventListener('wheel', (e) => {
  e.preventDefault();
  const f = e.deltaY > 0 ? 1.18 : 1 / 1.18;
  const p = svgPt(e);
  vb = { x: p.x - (p.x - vb.x) * f, y: p.y - (p.y - vb.y) * f, w: vb.w * f, h: vb.h * f };
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
}, { passive: false });
let dragFrom = null;
svg.addEventListener('pointerdown', (e) => { dragFrom = { x: e.clientX, y: e.clientY, vb: { ...vb } }; moved = false;
  svg.setPointerCapture(e.pointerId); });
svg.addEventListener('pointermove', (e) => {
  if (!dragFrom) return;
  const dx = e.clientX - dragFrom.x, dy = e.clientY - dragFrom.y;
  if (Math.abs(dx) + Math.abs(dy) > 5) moved = true;
  if (!moved) return;
  const scale = vb.w / svg.clientWidth;
  vb = { ...vb, x: dragFrom.vb.x - dx * scale, y: dragFrom.vb.y - dy * scale };
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
});
svg.addEventListener('pointerup', () => { dragFrom = null; });

draw();
</script>
</body>
</html>
